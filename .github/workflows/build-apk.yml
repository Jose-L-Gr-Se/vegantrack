# .github/workflows/build-apk.yml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap and answer JDK prompt
        run: |
          npm install -g @bubblewrap/cli
          # Pre-configure bubblewrap to skip JDK install prompt
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << 'EOF'
          {
            "jdkPath": "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.0-0/x64",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Find actual JDK path
        run: |
          JDK_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          SDK_PATH=$ANDROID_SDK_ROOT
          echo "JDK: $JDK_PATH"
          echo "SDK: $SDK_PATH"
          # Update config with real paths
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JDK_PATH",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Init Bubblewrap with config
        run: |
          mkdir -p apk-build && cd apk-build
          bubblewrap init \
            --manifest=https://vegantrack.vercel.app/manifest.json \
            --directory=.

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore apk-build/android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=VeganTrack,O=VeganTrack,C=ES"
          # Update twa-manifest.json with keystore info
          cd apk-build
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.signingKey = { path: '../android.keystore', alias: 'android' };
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Build APK
        run: |
          cd apk-build
          bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android

      - name: Find and upload APK
        run: find apk-build -name "*.apk" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vegantrack-apk
          path: apk-build/**/*.apk
          retention-days: 30
