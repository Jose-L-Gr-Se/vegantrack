name: Build Android AAB (Capacitor)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets (native mode — sin PWA service worker)
        run: npm run build:native
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Decodifica el keystore desde el secret Base64 al disco
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/vegantrack-release.jks

      # Inyecta las variables de firma en gradle.properties para que build.gradle las lea
      - name: Configure signing in gradle.properties
        run: |
          echo "KEYSTORE_FILE=vegantrack-release.jks" >> android/gradle.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}" >> android/gradle.properties
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties

      - name: Grant Gradle wrapper permission
        run: chmod +x android/gradlew

      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: vegantrack-${{ github.ref_name }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
