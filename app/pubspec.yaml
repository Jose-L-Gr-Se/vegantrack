name: vegantrack_app
description: VeganTrack — Alimentación vegana consciente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Backend — same Supabase project as the PWA
  supabase_flutter: ^2.5.3

  # Barcode scanner (ML Kit under the hood — fastest available)
  mobile_scanner: ^5.2.3

  # HTTP client
  dio: ^5.4.3+1

  # Local key-value cache (no code-gen required)
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Platform
  permission_handler: ^11.3.1
  share_plus: ^9.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # Utilities
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
